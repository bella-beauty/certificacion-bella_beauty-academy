<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BELLA BEAUTY ACADEMY · Evaluación Curso Brow Artist</title>
  
  <!-- Fallback Google Fonts for cross-device compatibility -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600;700&family=Pinyon+Script&family=Alex+Brush&display=swap" rel="stylesheet">

  <!-- html2pdf.js (CDN, with local fallback) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='assets/html2pdf.bundle.min.js';document.head.appendChild(s);"></script>

  <style>
    /* ==========================================================
       FONT DEFINITIONS (Local custom fonts + luxury fallbacks)
       ========================================================== */
    @font-face {
      font-family: 'Hatton';
      src: local('Hatton'), local('PP Hatton Medium'), url('fonts/Hatton-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'La Luxes Script';
      src: local('La Luxes Script'), url('fonts/LaLuxesScript-Regular.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'La Luxes Serif';
      src: local('La Luxes Serif'), url('fonts/LaLuxesSerif-Regular.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'Now';
      src: local('Now'), url('fonts/Now-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Now';
      src: local('Now Medium'), url('fonts/Now-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Now';
      src: local('Now Bold'), url('fonts/Now-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }

    /* ==========================================================
       CSS LUXURY VARIABLES (Deep Black & Metallic Gold)
       ========================================================== */
    :root {
      --font-title: 'Hatton', 'Cinzel', 'Playfair Display', Georgia, serif;
      --font-script: 'La Luxes Script', 'Alex Brush', 'Pinyon Script', cursive;
      --font-sub: 'Now', 'Montserrat', 'Segoe UI', sans-serif;
      --font-body: 'Now', 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;

      --gold-primary: #D4AF37;
      --gold-light: #F7E1A1;
      --gold-dark: #9A741E;
      --gold-shimmer: linear-gradient(135deg, #ECC880 0%, #D4AF37 40%, #B8860B 75%, #F7E1A1 100%);
      --gold-glow: 0 0 20px rgba(212, 175, 55, 0.45);
      
      --bg-deep: #080808;
      --card-bg: rgba(14, 13, 11, 0.90);
      --card-border: 1px solid rgba(212, 175, 55, 0.35);
      
      --text-main: #F3EBDD;
      --text-muted: #B8AC98;
      
      --color-correct: #2ECC71;
      --color-wrong: #E74C3C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* BACKGROUND WITH GOLD SACRED GEOMETRY SPIRAL & BOKEH */
    .bg-canvas-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      background-image: 
        radial-gradient(circle at 50% 25%, rgba(20, 18, 14, 0.45) 0%, rgba(8, 8, 8, 0.96) 100%),
        url('assets/bg_spiral_gold.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      opacity: 0.82;
    }

    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      pointer-events: none;
    }

    /* MAIN CONTAINER */
    .app-viewport {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 12px 18px 60px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR / NAVIGATION */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px;
      background: rgba(14, 13, 11, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 40px;
      margin-bottom: 14px;
      transition: all 0.3s ease;
    }

    .brand-compact {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-compact img {
      height: 28px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.5));
    }

    .brand-text-mini {
      font-family: var(--font-title);
      font-size: 13px;
      letter-spacing: 0.15em;
      color: var(--gold-primary);
      text-transform: uppercase;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--gold-light);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 15px;
    }

    .icon-btn:hover {
      background: rgba(212, 175, 55, 0.2);
      border-color: var(--gold-primary);
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    /* LUXURY CARDS */
    .luxury-card {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: var(--card-border);
      border-radius: 22px;
      padding: 26px 26px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.1);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .luxury-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--gold-shimmer);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.7);
    }

    /* SCREEN 1: WELCOME SCREEN */
    .welcome-screen {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .logo-hero-container {
      margin-top: 4px;
      margin-bottom: 0px;
      position: relative;
    }

    .logo-hero {
      max-width: 290px;
      width: 80%;
      height: auto;
      filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.5));
      animation: floatLogo 6s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .script-sub {
      font-family: var(--font-script);
      font-size: 32px;
      color: var(--gold-light);
      margin-top: -6px;
      margin-bottom: 0px;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
      letter-spacing: 0.04em;
    }

    .hero-title {
      font-family: var(--font-title);
      font-size: 26px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: var(--gold-shimmer);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .hero-trainer-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px;
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 30px;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--gold-light);
      text-transform: uppercase;
    }

    .trainer-avatar-mini {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--gold-primary);
      object-fit: cover;
    }

    .welcome-intro-text {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 660px;
      margin: 4px 0 6px;
    }

    .scale-info-box {
      background: rgba(212, 175, 55, 0.06);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 14px;
      padding: 12px 18px;
      max-width: 660px;
      width: 100%;
      font-size: 12.5px;
      color: var(--text-main);
      line-height: 1.5;
      text-align: left;
    }

    .scale-info-box strong {
      color: var(--gold-light);
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      margin: 8px 0 12px;
    }

    .feature-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(212, 175, 55, 0.18);
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
    }

    .feature-icon {
      font-size: 20px;
      color: var(--gold-primary);
      margin-bottom: 4px;
    }

    .feature-text {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: 0.03em;
    }

    .name-input-group {
      width: 100%;
      max-width: 440px;
      margin: 4px 0 12px;
      text-align: left;
    }

    .name-input-label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold-primary);
      margin-bottom: 6px;
      margin-left: 4px;
    }

    .luxury-input {
      width: 100%;
      padding: 14px 20px;
      background: rgba(10, 10, 10, 0.85);
      border: 1.5px solid rgba(212, 175, 55, 0.4);
      border-radius: 14px;
      color: #fff;
      font-family: var(--font-sub);
      font-size: 15px;
      letter-spacing: 0.04em;
      outline: none;
      transition: all 0.3s ease;
    }

    .luxury-input:focus {
      border-color: var(--gold-light);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.35);
      background: rgba(18, 17, 14, 0.95);
    }

    /* BUTTONS */
    .btn-gold-cta {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 38px;
      background: var(--gold-shimmer);
      border: none;
      border-radius: 40px;
      color: #0E0D0B;
      font-family: var(--font-title);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.45);
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .btn-gold-cta::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: rgba(255, 255, 255, 0.4);
      transform: rotate(30deg);
      transition: all 0.8s ease;
    }

    .btn-gold-cta:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 35px rgba(212, 175, 55, 0.65);
    }

    .btn-gold-cta:hover::after {
      left: 120%;
    }

    .btn-gold-cta:active {
      transform: translateY(0);
    }

    /* SCREEN 2: ACTIVE QUIZ */
    .quiz-hud {
      margin-bottom: 14px;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .hud-case-counter {
      font-family: var(--font-title);
      font-size: 13px;
      letter-spacing: 0.15em;
      color: var(--gold-light);
      text-transform: uppercase;
    }

    .hud-score-pill {
      padding: 5px 14px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--gold-primary);
    }

    .progress-bar-wrap {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--gold-shimmer);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.8);
      border-radius: 10px;
      width: 0%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* QUESTION CARD */
    .case-category-pill {
      display: inline-block;
      padding: 5px 12px;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 20px;
      font-family: var(--font-sub);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--gold-light);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .case-title-num {
      font-family: var(--font-script);
      font-size: 28px;
      color: var(--gold-primary);
      margin-bottom: 4px;
    }

    .case-question-text {
      font-size: 16.5px;
      line-height: 1.6;
      color: #FFFFFF;
      font-weight: 500;
      margin-bottom: 18px;
    }

    /* OPTIONS LIST */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .option-card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1.5px solid rgba(212, 175, 55, 0.22);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: left;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 14.5px;
      line-height: 1.5;
      position: relative;
    }

    .option-card:hover:not(.locked) {
      background: rgba(212, 175, 55, 0.08);
      border-color: var(--gold-primary);
      transform: translateX(4px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .option-card.locked {
      cursor: default;
    }

    .option-letter {
      width: 30px;
      height: 30px;
      min-width: 30px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      font-family: var(--font-title);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    /* OPTION STATES AFTER ANSWER */
    .option-card.correct {
      background: rgba(46, 204, 113, 0.14) !important;
      border-color: var(--color-correct) !important;
      box-shadow: 0 0 25px rgba(46, 204, 113, 0.35);
    }

    .option-card.correct .option-letter {
      background: var(--color-correct);
      border-color: var(--color-correct);
      color: #0E0D0B;
    }

    .option-card.incorrect-selected {
      background: rgba(231, 76, 60, 0.14) !important;
      border-color: var(--color-wrong) !important;
      box-shadow: 0 0 25px rgba(231, 76, 60, 0.35);
      animation: shake 0.4s ease;
    }

    .option-card.incorrect-selected .option-letter {
      background: var(--color-wrong);
      border-color: var(--color-wrong);
      color: #fff;
    }

    .option-card.faded {
      opacity: 0.45;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* FEEDBACK CARD / CLINICAL EXPLANATION */
    .feedback-drawer {
      margin-top: 18px;
      padding: 18px 20px;
      background: rgba(18, 16, 12, 0.95);
      border-left: 4px solid var(--gold-primary);
      border-radius: 0 14px 14px 0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: none;
      animation: fadeInUp 0.4s ease;
    }

    .feedback-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .feedback-status-badge.ok {
      color: var(--color-correct);
    }

    .feedback-status-badge.bad {
      color: var(--color-wrong);
    }

    .feedback-user-rationale {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .feedback-correct-recap {
      padding: 10px 14px;
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--gold-light);
      margin-bottom: 10px;
    }

    .feedback-source-ref {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .feedback-source-ref span {
      color: var(--gold-primary);
      font-weight: 600;
    }

    .quiz-next-actions {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
    }

    /* ==========================================================
       SCREEN 3: CERTIFICADO DE RENDIMIENTO (PREMIUM LANDSCAPE)
       ========================================================== */
    /* Fixed A4-landscape stage (1123 x 794 px) scaled to fit the viewport */
    .cert-stage {
      width: 100%;
      position: relative;
      margin: 0 auto 30px;
    }

    .cert-scaler {
      position: absolute;
      top: 0;
      left: 0;
      width: 1123px;
      height: 794px;
      transform-origin: top left;
      box-shadow: 0 0 60px rgba(212, 175, 55, 0.30), 0 25px 70px rgba(0, 0, 0, 0.9);
    }

    .certificate-card {
      position: relative;
      width: 1123px;
      height: 794px;
      overflow: hidden;
      box-sizing: border-box;
      background-color: #0a0908;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      color: #F3EBD3;
      text-align: center;
    }

    .certificate-card * {
      box-sizing: border-box;
    }

    .cert-shade {
      position: absolute;
      left: 0; top: 0; width: 1123px; height: 794px;
      background: radial-gradient(ellipse at 50% 42%, rgba(10, 9, 8, 0.62) 0%, rgba(8, 7, 6, 0.80) 70%, rgba(5, 5, 4, 0.90) 100%);
    }

    .cert-frame-outer {
      position: absolute;
      left: 20px; top: 20px; width: 1083px; height: 754px;
      border: 3px solid #D4AF37;
    }

    .cert-frame-inner {
      position: absolute;
      left: 32px; top: 32px; width: 1059px; height: 730px;
      border: 1px solid rgba(212, 175, 55, 0.65);
    }

    .cert-corner {
      position: absolute;
      width: 26px; height: 26px;
      border: 0 solid #E8C766;
    }
    .cert-corner.tl { left: 42px; top: 42px; border-top-width: 2px; border-left-width: 2px; }
    .cert-corner.tr { right: 42px; top: 42px; border-top-width: 2px; border-right-width: 2px; }
    .cert-corner.bl { left: 42px; bottom: 42px; border-bottom-width: 2px; border-left-width: 2px; }
    .cert-corner.br { right: 42px; bottom: 42px; border-bottom-width: 2px; border-right-width: 2px; }

    .cert-abs {
      position: absolute;
      left: 0;
      width: 1123px;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .cert-logo-img {
      position: absolute;
      left: 413px;
      top: 50px;
      width: 297px;
      height: auto;
    }

    .cert-main-title {
      top: 166px;
      font-family: var(--font-title);
      font-size: 38px;
      line-height: 46px;
      letter-spacing: 0.15em;
      color: #E3C26B;
      text-transform: uppercase;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
    }

    .cert-preamble {
      top: 224px;
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 12px;
      line-height: 16px;
      letter-spacing: 0.32em;
      color: #EFE6CC;
      text-transform: uppercase;
    }

    .cert-course-name {
      top: 242px;
      font-family: var(--font-script);
      font-size: 64px;
      line-height: 76px;
      color: #FFFFFF;
      text-shadow: 0 0 18px rgba(212, 175, 55, 0.55);
    }

    .cert-mencion {
      top: 328px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }

    .cert-mencion-line {
      display: block;
      width: 120px;
      height: 1px;
      background: #D4AF37;
    }

    .cert-mencion-text {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 15px;
      line-height: 22px;
      letter-spacing: 0.42em;
      color: #E3C26B;

      font-family: var(--font-title);
      font-size: 18px;

      text-transform: uppercase;

      position: absolute;
      left: 0; top: 73px; width: 300px;
      font-family: var(--font-body);
      font-size: 10px;
      line-height: 14px;
      letter-spacing: 0.2em;
      color: #CFC4A5;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ==========================================================
       INDEPENDENT CONSOLIDATED REPORT (BELOW CERTIFICATE)
       ========================================================== */
    .summary-report-card {
      width: 100%;
      background: rgba(14, 13, 11, 0.92);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 20px;
      padding: 28px 24px;
      margin-top: 10px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
    }

    .summary-title {
      font-family: var(--font-title);
      font-size: 20px;
      letter-spacing: 0.12em;
      color: var(--gold-primary);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 20px;
    }

    .summary-kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 14px;
      padding: 16px 12px;
      text-align: center;
    }

    .kpi-label {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .kpi-val {
      font-family: var(--font-title);
      font-size: 28px;
      color: var(--gold-light);
    }

    .kpi-status {
      font-size: 11.5px;
      font-weight: 600;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .kpi-status.ok {
      color: var(--color-correct);
    }

    .kpi-status.bad {
      color: var(--color-wrong);
    }

    /* "DÓNDE REFORZAR" SECTION */
    .reinforce-box {
      background: rgba(231, 76, 60, 0.07);
      border: 1px solid rgba(231, 76, 60, 0.35);
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 24px;
      text-align: left;
    }

    .reinforce-box.all-correct {
      background: rgba(46, 204, 113, 0.07);
      border-color: rgba(46, 204, 113, 0.35);
    }

    .reinforce-heading {
      font-family: var(--font-title);
      font-size: 16px;
      letter-spacing: 0.1em;
      color: var(--gold-light);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reinforce-items-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .reinforce-item {
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text-main);
      padding-left: 12px;
      border-left: 2px solid var(--gold-primary);
    }

    .reinforce-item span {
      color: var(--gold-light);
      font-weight: 600;
      display: block;
      font-size: 12px;
      margin-top: 2px;
    }

    .motivational-msg {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      font-size: 13.5px;
      line-height: 1.6;
      color: #E2D7BC;
      font-style: italic;
    }

    /* ACCORDION REVIEW OF ALL CASES */
    .review-section {
      width: 100%;
      text-align: left;
      margin-top: 8px;
    }

    .review-header-title {
      font-family: var(--font-title);
      font-size: 18px;
      letter-spacing: 0.1em;
      color: var(--gold-primary);
      text-transform: uppercase;
      margin-bottom: 14px;
      text-align: center;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .review-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      padding: 14px 18px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .review-card:hover {
      border-color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.05);
    }

    .review-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .review-card-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #fff;
    }

    .review-tag {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .review-tag.ok {
      background: rgba(46, 204, 113, 0.15);
      border: 1px solid var(--color-correct);
      color: var(--color-correct);
    }

    .review-tag.bad {
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid var(--color-wrong);
      color: var(--color-wrong);
    }

    .review-card-details {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-muted);
      display: none;
    }

    .review-card.open .review-card-details {
      display: block;
    }

    .results-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
      width: 100%;
    }

    .btn-secondary {
      padding: 14px 28px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 30px;
      color: var(--gold-light);
      font-family: var(--font-sub);
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-secondary:hover {
      background: rgba(212, 175, 55, 0.15);
      border-color: var(--gold-primary);
    }

    /* FOOTER */
    footer {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 14px;
      background: rgba(8, 8, 8, 0.95);
      border-top: 1px solid rgba(212, 175, 55, 0.25);
      color: var(--gold-primary);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    footer em {
      font-style: normal;
      color: #FFFFFF;
      font-weight: 700;
    }

    /* ANIMATIONS */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* TOAST ALERT */
    .toast-box {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 18, 14, 0.95);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 13px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .toast-box.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 768px) {
      .app-viewport {
        padding: 10px 12px 50px;
      }
      .luxury-card {
        padding: 20px 16px;
        border-radius: 16px;
      }
      .summary-kpi-grid {
        grid-template-columns: 1fr;
      }
      .features-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

  </style>
</head>

    const QUESTIONS_DATA = [{"id": 1, "question": "Una clienta con piel muy grasa consulta por qué el sombreado de henna en su piel solo le duró 7 días, mientras que a su amiga con piel seca le duró más de dos semanas. Según la fisiología del manto hidrolipídico explicada en la guía, ¿cuál es la razón técnica de esta diferencia?", "options": [{"letter": "A", "text": "El vello de las pieles grasas no absorbe la molécula de Lawsone por falta de hidratación y exceso de queratina dura.", "isCorrect": false, "feedback": "La molécula activa Lawsone se adhiere perfectamente a la queratina del vello independientemente del tipo de piel, siendo la retención sobre la piel la que varía por la grasa."}, {"letter": "B", "text": "La piel grasa metaboliza y elimina el pigmento con mayor rapidez debido a la alta producción de sebo y una acelerada descamación epitelial.", "isCorrect": true, "feedback": "¡Exacto! El exceso de secreción sebácea y la rápida renovación de la capa córnea en biotipos grasos provocan un desprendimiento acelerado de las células epidérmicas teñidas."}, {"letter": "C", "text": "La preparación de la henna en piel grasa exige un tiempo de exposición reducido a la mitad para evitar la saturación folicular.", "isCorrect": false, "feedback": "Reducir el tiempo de exposición en piel grasa disminuye aún más la pigmentación; al contrario, este biotipo suele requerir tiempos de fijación completos y una limpieza profunda previa."}, {"letter": "D", "text": "La henna utilizada en pieles grasas requiere peróxido de 20 volúmenes para lograr penetrar hasta la capa dérmica.", "isCorrect": false, "feedback": "La henna es un tinturado superficial no invasivo que actúa únicamente en la epidermis y no utiliza peróxidos de alto volumen para penetrar la dermis."}], "category": "FISIOLOGÍA Y BIOTIPOS CUTÁNEOS", "reference": "Guía Maestra · Cap. 2.4 (Retención y Manto Lipídico)"}, {"id": 2, "question": "Una clienta solicita epilación con cera y diseño de cejas. En la consulta previa indica que finalizó un tratamiento dermatológico con isotretinoína oral (Roacután) hace dos meses. ¿Cuál es la conducta técnica obligatoria que debe asumir la especialista?", "options": [{"letter": "A", "text": "Contraindicar de forma absoluta el uso de cera y realizar la epilación únicamente con hilo o pinza para prevenir un desprendimiento epidérmico severo.", "isCorrect": true, "feedback": "Respuesta correcta La isotretinoína provoca una atrofia sebácea y adelgazamiento extremo de la barrera cutánea que persiste hasta 6 meses después de suspender el fármaco, haciendo que el tirón de la cera levante la piel."}, {"letter": "B", "text": "Continuar con la cera de forma habitual reduciendo el tiempo de tracción y aplicando gel de aloe vera inmediatamente después.", "isCorrect": false, "feedback": "Respuesta incorrecta Aplicar gel calmante posterior no evita el daño mecánico e inmediato de desprendimiento de la capa epidérmica hiper-sensibilizada."}, {"letter": "C", "text": "Realizar la epilación con cera elástica de baja temperatura previa aplicación de talco para proteger la barrera cutánea.", "isCorrect": false, "feedback": "Aunque el talco reduce la adherencia a la piel, el uso de cera en cualquiera de sus variantes sigue estando estrictamente prohibido durante los 6 meses posteriores al uso de isotretinoína."}, {"letter": "D", "text": "Aplicar una capa gruesa de vaselina protectora en la zona y utilizar cera tibia en tiras a menor temperatura.", "isCorrect": false, "feedback": "La vaselina no previene la tracción mecánica sobre una epidermis frágil, y la cera tibia en tiras genera una adherencia traumática contraindicada en este biotipo."}], "category": "CONTRAINDICACIONES CLÍNICAS", "reference": "Guía Maestra · Cap. 5.4 (Tratamientos Médicos e Isotretinoína)"}, {"id": 3, "question": "Tras la neutralización del laminado de cejas, se procede a aplicar un tinte específico. Si el tiempo de exposición estándar del tinte sobre vello virgen es de 8 minutos, ¿qué tiempo de exposición se debe aplicar y por qué?", "options": [{"letter": "A", "text": "De 3 a 4 minutos, aplicando la Regla del 50% debido a la hiper-porosidad de la cutícula provocada por el proceso químico del laminado.", "isCorrect": true, "feedback": "Respuesta correcta La acción reductora y neutralizante del laminado deja las escamas de la cutícula abiertas, lo que acelera el procesamiento del tinte y exige reducir el tiempo a la mitad para evitar oscurecer excesivamente."}, {"letter": "B", "text": "1 minuto únicamente en la cola de la ceja, retirando el producto de forma inmediata con champú micelar.", "isCorrect": false, "feedback": "Un minuto resulta insuficiente para fijar de manera uniforme el pigmento en el cuerpo y cola, además de requerir un tiempo proporcional en toda la ceja."}, {"letter": "C", "text": "De 12 a 15 minutos, prolongando el tiempo debido a que los productos neutralizantes crean una barrera protectora impermeable al tinte.", "isCorrect": false, "feedback": "Respuesta incorrecta Las lociones del laminado no sellan ni impermeabilizan la fibra; por el contrario, abren la estructura haciéndola absorber el color mucho más rápido."}, {"letter": "D", "text": "8 minutos exactos, respetando la indicación del fabricante para asegurar que los puentes disulfuro se reordenen de forma permanente.", "isCorrect": false, "feedback": "Mantener el tiempo estándar sobre vello hiper-poroso provoca una absorción excesiva de pigmento, dejando la ceja manchada o totalmente negra."}], "category": "QUÍMICA Y LAMINADO DE CEJAS", "reference": "Guía Maestra · Cap. 16.2 (Regla del 50% post-laminado)"}, {"id": 4, "question": "Al realizar el mapping a una clienta que presenta una ceja 3 mm más alta que la otra debido a hipertonía muscular, ¿cómo se aplica correctamente la técnica del Punto Medio Compensatorio para alinear la altura sin despoblar la ceja?", "options": [{"letter": "A", "text": "Se traza la línea horizontal de nivelación 1,5 mm por debajo del borde de la ceja alta y 1,5 mm por encima del borde de la ceja baja.", "isCorrect": true, "feedback": "Respuesta correcta Dividir la brecha de asimetría al 50% permite rellenar con color la zona inferior de la ceja alta y epilar estratégicamente la ceja baja, logrando un equilibrio visual armónico."}, {"letter": "B", "text": "Se diseñan ambas cejas de forma independiente siguiendo la tracción de cada músculo frontal para respetar la expresión gestual.", "isCorrect": false, "feedback": "Ignorar la nivelación horizontal no resuelve la asimetría visual y contradice el objetivo de simetría compensatoria del mapping profesional."}, {"letter": "C", "text": "Se rebaja la ceja alta 3 mm desde su borde superior para alinearla al nivel exacto del arco de la ceja baja.", "isCorrect": false, "feedback": "Respuesta incorrecta Rebajar 3 mm directamente en una sola ceja destruye su grosor natural y la deja desproporcionada respecto a la otra."}, {"letter": "D", "text": "Se eleva la ceja baja 3 mm rellenando con henna por encima de su cuerpo natural sin modificar la posición de la ceja alta.", "isCorrect": false, "feedback": "Subir todo el tramo sobre la ceja baja dibuja una ceja completamente fuera del marco óseo, creando un aspecto artificial."}], "category": "ARQUITECTURA FACIAL Y MAPPING", "reference": "Guía Maestra · Cap. 7 (Punto Medio Compensatorio en Asimetrías)"}, {"id": 5, "question": "Durante un laminado, el vello del cuerpo y cola de la ceja de una clienta quedó retorcido en forma de 'Z' y quebradizo (efecto sobreprocesado). ¿Cuál es el protocolo de rescate químico e hídrico inmediato en cabina?", "options": [{"letter": "A", "text": "Lavar la zona con jabón desengrasante de alta alcalinidad y aplicar tinte híbrido oscuro para disimular la textura.", "isCorrect": false, "feedback": "Los productos alcalinos abren aún más las cutículas dañadas, agravando la deshidratación y la rotura del vello."}, {"letter": "B", "text": "Saturar el vello con peróxido de hidrógeno de 10 volúmenes para forzar el cierre inmediato de la cutícula.", "isCorrect": false, "feedback": "Respuesta incorrecta El peróxido de hidrógeno es un agente oxidante que genera mayor resequedad en una fibra capilar previamente desestructurada."}, {"letter": "C", "text": "Epilar con cera caliente los vellos afectados y teñir la piel subyacente con una capa gruesa de henna.", "isCorrect": false, "feedback": "Epilar vellos sobreprocesados elimina la estructura capilar en lugar de restaurarla, además de someter la piel sensibilizada a una agresión innecesaria."}, {"letter": "D", "text": "Realizar una re-alineación inversa con la Loción Onduladora (Paso 1) por 30 a 60 segundos, neutralizar por 60 segundos y aplicar tratamiento de reconstrucción proteica con film osmótico.", "isCorrect": true, "feedback": "Respuesta correcta La aplicación breve del ondulador ablanda el quiebre para corregir la alineación en sentido contrario, fijándolo con el neutralizante y sellando la fibra con nutrición intensiva."}], "category": "RESCATE Y PROTOCOLO DE EMERGENCIA", "reference": "Guía Maestra · Cap. 17.2 (Rescate de Vello Sobreprocesado)"}, {"id": 6, "question": "¿Por qué está contraindicada la aplicación de henna comercial tradicional con elevado contenido de Parapfenilendiamina (PPD) inmediatamente después de un laminado de cejas?", "options": [{"letter": "A", "text": "Porque la henna impide la absorción de los aceites nutritivos en el proceso de nutrición posterior.", "isCorrect": false, "feedback": "El problema principal no es la interferencia con los aceites, sino el potencial alergénico e irritante de los aditivos químicos en tejidos sensibles."}, {"letter": "B", "text": "Porque los pigmentos de la henna anulan la reacción del Paso 2 provocando que el vello vuelva inmediatamente a su dirección rizada original.", "isCorrect": false, "feedback": "La henna no revierte la recombinación de los puentes disulfuro fijados por el neutralizante; el riesgo radica en la agresión química a la piel y el vello."}, {"letter": "C", "text": "Porque la pasta de henna se degrada y pierde su capacidad colorante al entrar en contacto con vellos que poseen un pH neutro.", "isCorrect": false, "feedback": "Respuesta incorrecta La molécula Lawsone tiñe la queratina sin importar variaciones leves de pH, siendo la sensibilidad cutánea y cuticular la verdadera limitante."}, {"letter": "D", "text": "Porque la interacción de los agentes reductores alcalinos con el PPD sobre la cutícula expuesta genera un alto riesgo de dermatitis de contacto y resequedad extrema en la fibra.", "isCorrect": true, "feedback": "Respuesta correcta Tras la alteración química del laminado, los componentes sintéticos de fijación rápida en ciertas hennas penetran agresivamente la piel y la corteza abierta, provocando reacciones alérgicas o daño capilar."}], "category": "COMPATIBILIDAD QUÍMICA", "reference": "Guía Maestra · Cap. 16.3 (Contraindicaciones Químicas)"}, {"id": 7, "question": "¿En qué contenedor de bioseguridad deben depositarse de forma inmediata las navajas o perfiladores metálicos desechables al finalizar la epilación?", "options": [{"letter": "A", "text": "En el contenedor rígido de bioseguridad (Guardián Rojo) destinado a elementos cortopunzantes.", "isCorrect": true, "feedback": "¡Exacto! Todo instrumental con filo o capacidad de punción debe desecharse en recipientes rígidos e imperforables marcados con riesgo biológico para evitar pinchazos accidentales."}, {"letter": "B", "text": "En la bolsa negra o gris de la estación de trabajo destinada a basura común inerte.", "isCorrect": false, "feedback": "Deschar instrumental filoso en bolsas de basura común viola las normas de bioseguridad e incrementa el riesgo de accidentes ocupacionales."}, {"letter": "C", "text": "En la bolsa roja flexible de bioseguridad para residuos biopatológicos y gasas contaminadas.", "isCorrect": false, "feedback": "Las bolsas de polietileno pueden ser perforadas fácilmente por objetos afilados, representando un grave riesgo biológico para el operador."}, {"letter": "D", "text": "En un vaso de cristal sumergido en alcohol al 70% para su posterior desinfección y reutilización.", "isCorrect": false, "feedback": "Las hojas de afeitar y navajas desechables son estrictamente de un solo uso y nunca deben reutilizarse ni desinfectarse entre clientas."}], "category": "BIOSEGURIDAD Y SANIDAD", "reference": "Guía Maestra · Cap. 4.4 (Segregación de Instrumental Cortopunzante)"}, {"id": 8, "question": "Al aplicar la regla de la proporción áurea (1,618) en la arquitectura de la ceja, ¿qué porcentaje de la longitud total debe corresponder al cuerpo (P1 a P2) respecto a la cola (P2 a P3)?", "options": [{"letter": "A", "text": "El cuerpo ocupa el 40% del trazado y la cola el 60%, alargando el arco en dirección a la sien.", "isCorrect": false, "feedback": "Asignar un 60% a la cola alarga en exceso el final de la ceja, rompiendo la armonía geométrica del visagismo facial."}, {"letter": "B", "text": "El cuerpo representa el 50% de la ceja y la cola el 50% sobrante, dividiendo el trazo en dimensiones iguales.", "isCorrect": false, "feedback": "Una ceja con 50% de cola desplaza el arco hacia el centro, creando un efecto de mirada triste o desproporcionada."}, {"letter": "C", "text": "El cuerpo abarca el 75% de la extensión total dejando un 25% para el remate de la cola.", "isCorrect": false, "feedback": "Respuesta incorrecta Una cola demasiado corta (25%) genera una ceja incompleta y gruesa que acorta visualmente la zona periocular."}, {"letter": "D", "text": "El cuerpo representa el 60% de la longitud total (3 partes) y la cola el 40% restante (2 partes).", "isCorrect": true, "feedback": "Respuesta correcta La proporción armónica 3:2 fija el centro de gravedad visual en la elevación del arco, evitando que la cola sea demasiado larga y deprima la mirada."}], "category": "GEOMETRÍA Y PROPORCIÓN ÁUREA", "reference": "Guía Maestra · Cap. 6.2 (Proporción Áurea Phi 1.618 en Cabina)"}, {"id": 9, "question": "Tras batir la henna en polvo con su activador hasta lograr una textura cremosa tipo yogur, ¿cuál es el paso técnico previo a la aplicación en la piel y cuál es su finalidad?", "options": [{"letter": "A", "text": "Incorporar 5 gotas adicionales de peróxido de 10 volúmenes para acelerar el secado sobre la piel.", "isCorrect": false, "feedback": "Adicionar peróxido altera la naturaleza de la henna profesional y puede causar irritación o virajes no deseados en el color."}, {"letter": "B", "text": "Aplicar de inmediato sobre la ceja para aprovechar la acción de los exfoliantes activos antes de que se evaporen.", "isCorrect": false, "feedback": "Respuesta incorrecta Aplicar la henna recién batida sin reposo provoca una fijación deficiente o parches descoloridos por falta de activación de la materia prima."}, {"letter": "C", "text": "Dejar reposar la mezcla durante 3 a 5 minutos para permitir la correcta maceración y oxidación inicial del pigmento.", "isCorrect": true, "feedback": "Respuesta correcta El tiempo de reposo en el contenedor libera la molécula de Lawsone y homogeniza la pasta para garantizar que pigmenta de forma pareja sin manchas."}, {"letter": "D", "text": "Someter la mezcla a calor mediante la lámpara de trabajo durante 2 minutos para esterilizar los pigmentos minerales.", "isCorrect": false, "feedback": "El calor directo degrada la mezcla y altera la consistencia de la pasta reduciendo su adherencia en el tejido cutáneo."}], "category": "COLORIMETRÍA Y QUÍMICA DE HENNA", "reference": "Guía Maestra · Cap. 13 & 14 (Maceración y Oxidación de Lawsone)"}, {"id": 10, "question": "Para lograr un acabado degradado natural (Ombré Brows) en un servicio con henna con tiempo total de exposición de 20 minutos, ¿cuál es el protocolo de retirada escalonada?", "options": [{"letter": "A", "text": "Retirar la henna de la cola a los 5 minutos, del cuerpo a los 10 minutos y mantener el inicio hasta los 20 minutos.", "isCorrect": false, "feedback": "Dejar más tiempo en la cabeza genera un inicio oscuro y marcado (efecto bloque), lo opuesto al degradado suave del Ombré."}, {"letter": "B", "text": "Retirar el pigmento a los 5-8 minutos en la cabeza (inicio), a los 15 minutos en el cuerpo y a los 20 minutos en la cola.", "isCorrect": true, "feedback": "¡Exacto! La retirada diferida limita la impregnación en el inicio para lograr un efecto traslúcido mientras intensifica la densidad en la cola."}, {"letter": "C", "text": "Retirar toda la ceja de forma simultánea a los 20 minutos y frotar con algodón seco el inicio para aclararlo mecánicamente.", "isCorrect": false, "feedback": "Frotar la piel de forma brusca con un algodón seco irrita la capa córnea y no garantiza un degradado limpio ni controlado."}, {"letter": "D", "text": "Retirar la mezcla a los 10 minutos en toda la ceja y aplicar removedor de henna diluido en la zona del arco.", "isCorrect": false, "feedback": "El removedor se usa para limpiar trazos fuera de marco, no para construir el degradado interno del diseño."}], "category": "TÉCNICAS AVANZADAS DE PIGMENTACIÓN", "reference": "Guía Maestra · Cap. 14.2 (Tiempos Escalonados Ombré Brows)"}, {"id": 11, "question": "¿En qué estrato de la estructura piel se fija temporalmente el pigmento orgánico de la henna para cejas?", "options": [{"letter": "A", "text": "En las capas más superficiales de la epidermis (estrato córneo), desvaneciéndose progresivamente con el ciclo de queratinización.", "isCorrect": true, "feedback": "Respuesta correcta La henna deposita sus moléculas de color en las células queratinizadas de la capa córnea epidérmica, durando hasta que estas se descaman de forma natural."}, {"letter": "B", "text": "En la dermis reticular, donde interactúa directamente con el bulbo piloso y la papila vascular.", "isCorrect": false, "feedback": "Respuesta incorrecta Los tintes temporales no penetran la lámina basal hacia la dermis; la pigmentación dérmica requiere agujas como en el micropigmentado."}, {"letter": "C", "text": "En el tejido adiposo de la hipodermis para fijar un efecto de sombra permanente de larga duración.", "isCorrect": false, "feedback": "La hipodermis es la capa profunda subcutánea; la henna es un procedimiento cosmético exclusivamente epidérmico e inofensivo."}, {"letter": "D", "text": "En la papila folicular a través de absorción por poros dilatados sin romper la barrera cutánea.", "isCorrect": false, "feedback": "El pigmento no se absorbe en la papila folicular; su fijación se da por impregnación en la queratina del vello y de la epidermis."}], "category": "HISTOLOGÍA Y ESTRUCTURA CUTÁNEA", "reference": "Guía Maestra · Cap. 2.1 (Estrato Córneo y Queratinización)"}, {"id": 12, "question": "Para prevenir la contaminación cruzada al tomar productos cosméticos como vaselina o pasta de henna de su recipiente original, ¿cuál es el protocolo obligatorio?", "options": [{"letter": "A", "text": "Utilizar guantes de nitrilo limpios para tomar el producto con la yema de los dedos directamente del recipiente comercial.", "isCorrect": false, "feedback": "Introducir guantes que han tocado el entorno o la piel de la clienta contamina el producto para usos posteriores con otros pacientes."}, {"letter": "B", "text": "Limpiar el pincel de trabajo con una toallita húmeda antes de sumergirlo nuevamente dentro del frasco comercial.", "isCorrect": false, "feedback": "Respuesta incorrecta Las toallitas húmedas no esterilizan ni eliminan microorganismos del pincel, permitiendo la proliferación bacteriana en el contenedor."}, {"letter": "C", "text": "Extraer la cantidad requerida utilizando una espátula limpia y descartable, evitando reintroducir elementos contaminados en el envase.", "isCorrect": true, "feedback": "Respuesta correcta Utilizar espátulas de un solo uso para extraer producto impide que bacterias o fluidos de la cabina entren en contacto con la reserva principal."}, {"letter": "D", "text": "Aplicar alcohol isopropílico al 70% directamente en la superficie del producto para mantenerlo desinfectado tras cada servicio.", "isCorrect": false, "feedback": "Mezclar desinfectantes dentro del cosmético altera la fórmula, pierde efectividad técnica y puede irritar la piel de la clienta."}], "category": "ASEPSIA Y PREVENCIÓN CRUZADA", "reference": "Guía Maestra · Cap. 4.1 (Asepsia y Manejo de Insumos Cosméticos)"}, {"id": 13, "category": "BIOSEGURIDAD Y REPROCESAMIENTO", "reference": "Guía Maestra · Cap. 4.3 (Tratamiento del Instrumental Metálico)", "question": "¿Cuál es la secuencia clínica obligatoria para el reprocesamiento y esterilización de las pinzas metálicas de epilación tras atender a cada clienta?", "options": [{"letter": "A", "text": "Sumergirlas directamente en alcohol al 70% durante 5 minutos y secar con toalla de papel.", "isCorrect": false, "feedback": "El alcohol al 70% no esteriliza ni destruye esporas bacterianas o virus sanguíneos; además, sumergir instrumental con restos orgánicos sin lavado previo inactiva el desinfectante."}, {"letter": "B", "text": "1° Lavado con detergente enzimático, 2° Desinfección de Alto Nivel (DAN) y secado, y 3° Empaque hermético y esterilización en Autoclave.", "isCorrect": true, "feedback": "¡Exacto! El reprocesamiento hospitalario exige eliminar restos proteicos con detergente enzimático antes de desinfectar y someter el instrumental embolsado al calor húmedo bajo presión en autoclave para garantizar esterilidad absoluta."}, {"letter": "C", "text": "Lavar con jabón de manos bajo agua corriente y rociar con spray antibacterial antes del siguiente servicio.", "isCorrect": false, "feedback": "El jabón común y los sprays antibacterianos de superficie no alcanzan el nivel biocida necesario para instrumental que entra en contacto con folículos pilosos y microlesiones cutáneas."}, {"letter": "D", "text": "Introducir las pinzas en un esterilizador de cuarzo durante 30 segundos entre clienta y clienta.", "isCorrect": false, "feedback": "Los esterilizadores de esferas de cuarzo no están certificados por las normas de bioseguridad sanitaria internacional para esterilización de instrumental crítico en cabina."}]}, {"id": 14, "category": "ARQUITECTURA FACIAL ANTI-AGE", "reference": "Guía Maestra · Cap. 3.4 (Visagismo en Piel Madura / Efecto Lifting)", "question": "Una clienta de 56 años presenta pérdida de colágeno en la región periocular y ptosis (caída) del párpado móvil. Según el visagismo científico de la guía, ¿qué directriz de diseño genera un efecto 'Lifting Óptico'?", "options": [{"letter": "A", "text": "Elevar ligeramente el punto alto (Ápex / P2) y asegurar que la cola (P3) no descienda por debajo de la altura horizontal del inicio (P1), despejando el párpado.", "isCorrect": true, "feedback": "¡Exacto! Mantener la cola a la altura o ligeramente por encima del inicio despeja visualmente el párpado fijo y móvil, abriendo la mirada y restando pesadez al tercio superior sin recurrir a cirugía."}, {"letter": "B", "text": "Alargar la cola de la ceja hacia abajo siguiendo la curvatura del músculo orbicular para enmarcar la cuenca ocular.", "isCorrect": false, "feedback": "Prolongar la cola hacia abajo acentúa la caída del párpado y entristece la mirada (efecto de mirada cansada o envejecida)."}, {"letter": "C", "text": "Diseñar una ceja completamente plana y horizontal para cortar la flacidez del rostro.", "isCorrect": false, "feedback": "Una ceja excesivamente horizontal en párpados con ptosis crea una sensación de pesadez sobre los ojos en lugar de elevar la mirada."}, {"letter": "D", "text": "Depilar todo el arco natural y dibujar un pico pronunciado a 90 grados con henna negra.", "isCorrect": false, "feedback": "Los ángulos duros y artificiales endurecen las facciones y contrastan negativamente con la laxitud natural del tejido maduro."}]}, {"id": 15, "category": "TÉCNICAS DE EPILACIÓN CON CERA", "reference": "Guía Maestra · Cap. 11.2 (Biomecánica de Aplicación y Tensión de Piel)", "question": "Al retirar una banda de cera elástica en la zona periocular, ¿cuál es la maniobra biomecánica correcta para evitar hematomas, flacidez o desprendimiento epidérmico?", "options": [{"letter": "A", "text": "Tirar de la cera hacia arriba a un ángulo de 90 grados perpendicular al rostro para asegurar el arranque de raíz.", "isCorrect": false, "feedback": "Tirar hacia arriba a 90° tracciona la piel de forma violenta, provocando desprendimiento de la capa córnea, equimosis (moratones) y flacidez prematura en el tejido periocular."}, {"letter": "B", "text": "Tensar firmemente la piel en sentido contrario con la mano libre y retirar la cera de forma paralela y a ras de la piel en dirección contraria al crecimiento del vello.", "isCorrect": true, "feedback": "¡Exacto! La tensión de la piel inmoviliza el tejido celular subcutáneo, mientras que el tirón paralelo a ras de la piel minimiza el trauma mecánico y extrae el folículo limpiamente sin pellizcar la epidermis."}, {"letter": "C", "text": "Retirar la cera lentamente y por etapas para que la clienta no sienta dolor durante el procedimiento.", "isCorrect": false, "feedback": "Retirar la cera de forma lenta fragmenta la banda, parte el vello a la mitad y aumenta exponencialmente la sensación dolorosa en la clienta."}, {"letter": "D", "text": "Aplicar la cera muy caliente para que penetre más profundo en el folículo y retirarla sin estirar la piel.", "isCorrect": false, "feedback": "La cera caliente quema la fina piel periocular; además, no tensar la piel es la causa número uno de hematomas y desgarro tisular en cabina."}]}, {"id": 16, "category": "BIOSEGURIDAD Y CONTROL DE ALERGIAS", "reference": "Guía Maestra · Cap. 5.2 (Protocolo de Ejecución de la Prueba de Parche)", "question": "¿Cuál es el protocolo estándar de aplicación, tiempo de contacto y monitoreo obligatorio de la Prueba de Parche (Patch Test) en clientes nuevos antes de usar Henna o Tintes?", "options": [{"letter": "A", "text": "Aplicar la mezcla en la propia ceja 10 minutos antes de comenzar el servicio y verificar si pica.", "isCorrect": false, "feedback": "Realizar la prueba en la ceja inmediatamente antes del servicio viola el protocolo: si la clienta reacciona, sufrirá inflamación facial y las reacciones tardías mediadas por células demoran hasta 48 horas en manifestarse."}, {"letter": "B", "text": "Realizar la prueba entre 48 y 72 horas previas en antebrazo o zona retroauricular, dejar actuar la mezcla por 20 minutos, retirar con agua y monitorear la zona durante 48 horas.", "isCorrect": true, "feedback": "¡Exacto! El tiempo de contacto de 20 minutos permite la absorción mínima de los alérgenos potenciales (como la PPD) y la ventana de 48 a 72 horas cubre el periodo inmunológico de manifestación de la dermatitis por contacto."}, {"letter": "C", "text": "Colocar una gota de activador puro detrás de la rodilla y retirar tras 2 horas de reposo.", "isCorrect": false, "feedback": "La prueba debe realizarse con la mezcla completa del producto a utilizar (pigmento + activador) y en zonas con características dérmicas similares a la piel periocular (antebrazo interno o detrás de la oreja)."}, {"letter": "D", "text": "Omitir la prueba si la clienta asegura que nunca ha tenido alergia a tintes de cabello convencionales.", "isCorrect": false, "feedback": "La sensibilización a la PPD puede ser adquirida en cualquier momento de la vida; confiar en el testimonio verbal sin prueba física expone a la especialista a demandas legales graves."}]}, {"id": 17, "category": "CORRECCIÓN Y PROTOCOLOS DE EMERGENCIA", "reference": "Guía Maestra · Cap. 17.1 (Corrección de Cejas Hiper-Pigmentadas)", "question": "Tras retirar la henna, la clienta manifiesta angustia porque percibe sus cejas excesivamente oscuras y marcadas. ¿Cuál es la conducta técnica inmediata y profesional que debe adoptar la especialista en cabina?", "options": [{"letter": "A", "text": "Frotar con fuerza la piel utilizando una gasa seca o piedra pómez facial para desgastar mecánicamente el estrato córneo.", "isCorrect": false, "feedback": "La fricción mecánica abrasiva lesiona la barrera cutánea, genera eritema severo, ardor y puede derivar en manchas postinflamatorias irreversibles."}, {"letter": "B", "text": "Contener a la clienta con serenidad, aplicar champú de limpieza profunda o removedor de henna específico con ácidos frutales mediante movimientos suaves de dabbing y peinar con aceite nutritivo.", "isCorrect": true, "feedback": "¡Exacto! El removedor de henna con agentes quelantes o ácidos suaves emulsiona el exceso superficial de Lawsone en el estrato córneo sin agredir la piel, mientras que el aceite aporta luminosidad y suaviza visualmente el tono."}, {"letter": "C", "text": "Aplicar decolorante capilar de 30 volúmenes sobre la ceja para degradar el color instantáneamente.", "isCorrect": false, "feedback": "El decolorante de alto volumen sobre vello recién tinturado con henna puede alterar el pigmento hacia tonos verdes indeseados y quemar la fibra capilar."}, {"letter": "D", "text": "Indicar a la clienta que se lave la cara con cloro en su casa para rebajar el tono.", "isCorrect": false, "feedback": "El uso de químicos abrasivos domésticos es un atentado gravísimo contra la salud dermatológica de la clienta."}]}, {"id": 18, "category": "QUÍMICA Y LAMINADO DE CEJAS", "reference": "Guía Maestra · Cap. 15.5 (Tabla de Tiempos del Ondulador)", "question": "Al iniciar un servicio de laminado de cejas, diagnosticas que la clienta posee vello muy fino, claro y químicamente sensibilizado por tintes previos. ¿Qué pauta técnica de aplicación debes seguir estrictamente?", "options": [{"letter": "A", "text": "Aplicar la Loción Onduladora (Paso 1) de 3 a 5 minutos como máximo y trabajar SIN film osmótico, monitoreando constantemente la maleabilidad del vello.", "isCorrect": true, "feedback": "¡Exacto! El vello fino o sensibilizado posee una cutícula muy delgada que absorbe el tioglicolato o cisteamina a gran velocidad. El uso de film aceleraría la reacción térmica y quemaría el vello en minutos."}, {"letter": "B", "text": "Dejar e     /* ==========================================================
       WEB AUDIO SYNTHESIZER (Tactile sound effects)
       ========================================================== */
    class SoundManager {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
      }

      playCorrect() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.08);

          gain.gain.setValueAtTime(0, now + i * 0.08);
          gain.gain.linearRampToValueAtTime(0.12, now + i * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.5);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.5);
        });
      }

      playIncorrect() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        [220, 196].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + i * 0.12);

          gain.gain.setValueAtTime(0.15, now + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now + i * 0.12);
          osc.stop(now + i * 0.12 + 0.35);
        });
      }

      playFanfare() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
        notes.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.09);

          gain.gain.setValueAtTime(0, now + i * 0.09);
          gain.gain.linearRampToValueAtTime(0.16, now + i * 0.09 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.85);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now + i * 0.09);
          osc.stop(now + i * 0.09 + 0.85);
        });
      }
    }

    const particleCanvas = document.getElementById('particle-canvas');

    function resizeParticleCanvas() {

    class GoldParticle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * particleCanvas.width;
        this.y = Math.random() * particleCanvas.height;
        this.size = Math.random() * 2.2 + 0.6;
        this.speedY = -(Math.random() * 0.4 + 0.15);
        this.speedX = (Math.random() - 0.5) * 0.2;
        this.alpha = Math.random() * 0.6 + 0.2;
        this.pulse = Math.random() * 0.02 + 0.005;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.alpha += Math.sin(Date.now() * 0.002) * this.pulse;
        if (this.y < -10 || this.x < -10 || this.x > particleCanvas.width + 10) {
          this.reset();
          this.y = particleCanvas.height + 10;
        }
      }
      draw() {
        pCtx.save();
        pCtx.beginPath();
        pCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        pCtx.fillStyle = `rgba(236, 200, 128, ${Math.max(0.1, Math.min(0.8, this.alpha))})`;
        pCtx.shadowBlur = 8;
        pCtx.shadowColor = 'rgba(212, 175, 55, 0.8)';
        pCtx.fill();
        pCtx.restore();
      }
    }

    for (let i = 0; i < 45; i++) {
      particles.push(new GoldParticle());
    }

    function animateParticles() {
      pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);

        p.update();
        p.draw();
      });

    }

      constructor() {
        this.x = Math.random() * confettiCanvas.width;

        this.size = Math.random() * 9 + 5;
        this.speedY = Math.random() * 3 + 2;

      update() {

        this.rotation += this.rotationSpeed;

      draw() {
        cCtx.save();
        cCtx.translate(this.x, this.y);
        cCtx.rotate((this.rotation * Math.PI) / 180);
        cCtx.fillStyle = this.color;
        cCtx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.6);
        cCtx.restore();
      }
    }

    function calculateGrade(score, total = 20) {
      const passingScore = Math.round(total * 0.6); // 12
      let grade;
      if (score <= passingScore) {
        grade = (score / passingScore) * 4.0;
      } else {
        grade = 4.0 + ((score - passingScore) / (total - passingScore)) * 3.0;
      }
      return Math.round(grade * 10) / 10;
    }
